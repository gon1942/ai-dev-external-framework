[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "team-ai-dev-framework"
version = "2.0.0"
description = "Agent-independent, evidence-driven team development workflow"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Team AI Dev Framework"}]

[project.scripts]
teamdev = "teamdev.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
teamdev = ["assets/**/*"]
